# Static site for «Лисёнок и звёзды» on the same VPS as Kto (nginx + Let's Encrypt via certbot).
server {
    listen 80;
    listen [::]:80;
    server_name lisenok.151.243.212.26.nip.io;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/lisenok-certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lisenok.151.243.212.26.nip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/lisenok.151.243.212.26.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lisenok.151.243.212.26.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lisenok.access.log;
    error_log /var/log/nginx/lisenok.error.log;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/lisenok/current;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location ~ ^/(art|voice|sfx|music|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ /index.html; }
}
